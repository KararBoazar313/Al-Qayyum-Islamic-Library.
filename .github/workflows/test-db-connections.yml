name: Verify Qayyum API

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/test-db-connections.yml"
      - "Dockerfile.api"
      - "index.html"
      - "app.js"
      - "styles.css"
      - "database/**"
      - "server/package.json"
      - "server/scripts/**"
      - "server/src/**"
      - "tests/**"

jobs:
  backend-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check JavaScript syntax
        run: |
          node --check app.js
          node --check server/src/index.js
          node --check server/scripts/migrate.js
      - name: Run backend smoke tests
        run: |
          npm install --no-audit --no-fund --prefix server
          npm test --prefix server
      - name: Probe Railway API health and readiness
        shell: bash
        run: |
          set -euo pipefail
          base="https://al-qayyum-library-api-production.up.railway.app"

          echo "Checking API health"
          curl --fail-with-body --retry 12 --retry-delay 10 --retry-all-errors --max-time 20 \
            "$base/api/health" -o /tmp/qayyum-health.json
          cat /tmp/qayyum-health.json
          jq -e '.status == "ok" and .databaseConfigured == true and .privateStorageConfigured == true and .privateStorageDurable == true' \
            /tmp/qayyum-health.json

          echo "Checking API readiness (PostgreSQL + durable private storage)"
          curl --fail-with-body --retry 12 --retry-delay 10 --retry-all-errors --max-time 20 \
            "$base/api/ready" -o /tmp/qayyum-ready.json
          cat /tmp/qayyum-ready.json
          jq -e '.status == "ready" and .database == true and .privateStorageDurable == true' \
            /tmp/qayyum-ready.json

          echo "Checking browser CORS for the GitHub Pages frontend"
          curl -sS -D /tmp/qayyum-cors-headers -o /dev/null -X OPTIONS \
            -H "Origin: https://kararboazar313.github.io" \
            -H "Access-Control-Request-Method: POST" \
            -H "Access-Control-Request-Headers: authorization,content-type" \
            "$base/api/auth/google"
          grep -iq '^access-control-allow-origin: https://kararboazar313.github.io' /tmp/qayyum-cors-headers
          grep -iq '^access-control-allow-methods:.*POST' /tmp/qayyum-cors-headers

          echo "Checking file-review routes are protected by authentication"
          queue_status=$(curl -sS -o /tmp/qayyum-queue-unauth.json -w '%{http_code}' "$base/api/admin/files/review-queue")
          test "$queue_status" = "401"
          review_status=$(curl -sS -o /tmp/qayyum-review-unauth.json -w '%{http_code}' -X PUT -H "Content-Type: application/json" -d '{}' "$base/api/admin/files/00000000-0000-0000-0000-000000000000/review")
          test "$review_status" = "401"

          echo "Checking Firebase Google-token verification is configured"
          dummy_token=$(printf 'x%.0s' {1..128})
          google_status=$(curl -sS -o /tmp/qayyum-google-auth.json -w '%{http_code}' -X POST \
            -H "Content-Type: application/json" \
            -d "{\"idToken\":\"$dummy_token\"}" \
            "$base/api/auth/google")
          test "$google_status" = "401"


