name: Inspect Neon Database

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/test-db-connections.yml"
      - "server/src/**"
      - "server/scripts/preflight.js"
      - "tests/server-smoke.test.js"

jobs:
  inspect-neon:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run backend smoke tests
        run: |
          npm install --no-audit --no-fund --prefix server
          npm test --prefix server
      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client

      - name: Inspect Neon connection and existing schema (read-only)
        env:
          DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
        run: |
          test -n "$DATABASE_URL"
          psql "$DATABASE_URL" -X -v ON_ERROR_STOP=1 \
            -c "SELECT current_database() AS database_name, current_setting('server_version') AS postgres_version;" \
            -c "SELECT nspname AS schema_name FROM pg_namespace WHERE nspname = 'qayyum';" \
            -c "SELECT schemaname, tablename FROM pg_tables WHERE schemaname = 'qayyum' ORDER BY tablename;"

          HAS_LEDGER="$(psql "$DATABASE_URL" -X -At -v ON_ERROR_STOP=1 -c "SELECT to_regclass('qayyum.schema_migrations') IS NOT NULL;")"
          if [ "$HAS_LEDGER" = "t" ]; then
            echo "MIGRATION_LEDGER_PRESENT"
            psql "$DATABASE_URL" -X -v ON_ERROR_STOP=1 \
              -c "SELECT version, filename, applied_at FROM qayyum.schema_migrations ORDER BY version;"
          else
            echo "MIGRATION_LEDGER_MISSING"
          fi

      - name: Probe deployed API health and readiness
        run: |
          for endpoint in health ready; do
            url="https://al-qayyum-islamic-library.enzonic.dev/api/$endpoint"
            echo "Checking $url"
            code="$(curl -sS --max-time 20 -o "/tmp/qayyum-$endpoint.json" -w "%{http_code}" "$url" || true)"
            echo "HTTP_STATUS_$endpoint=$code"
            cat "/tmp/qayyum-$endpoint.json" 2>/dev/null || true
            echo
          done
