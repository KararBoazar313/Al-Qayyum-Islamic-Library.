services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: qayyum
      POSTGRES_USER: qayyum_app
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in your private environment}
    volumes:
      - qayyum_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U qayyum_app -d qayyum"]
      interval: 10s
      timeout: 5s
      retries: 10

  migrate:
    build:
      context: .
      dockerfile: Dockerfile.api
    command: ["node", "scripts/migrate.js"]
    environment:
      DATABASE_URL: postgresql://qayyum_app:${POSTGRES_PASSWORD}@db:5432/qayyum
      PGSSL: "false"
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    restart: unless-stopped
    environment:
      PORT: 8787
      DATABASE_URL: postgresql://qayyum_app:${POSTGRES_PASSWORD}@db:5432/qayyum
      PGSSL: "false"
      JWT_SECRET: ${JWT_SECRET:?Set a random JWT_SECRET of at least 32 characters}
      CORS_ORIGIN: ${CORS_ORIGIN:?Set the exact HTTPS frontend origin}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:?Set the HTTPS public URL}
      PRIVATE_STORAGE_DIR: /private-storage
      MAX_UPLOAD_BYTES: ${MAX_UPLOAD_BYTES:-52428800}
    volumes:
      - qayyum_private_files:/private-storage
    ports:
      - "127.0.0.1:8787:8787"
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8787/readyz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 20s
      timeout: 5s
      retries: 5

volumes:
  qayyum_pgdata:
  qayyum_private_files:
